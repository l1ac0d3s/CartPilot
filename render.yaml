# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# After the first deploy, fill in the "sync: false" values with the services' public URLs.
databases:
  - name: cartpilot-db
    plan: free
    databaseName: cartpilot
    user: cartpilot

services:
  - type: web
    name: cartpilot-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cartpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL # e.g. https://cartpilot-ml.onrender.com
        sync: false
      - key: FRONTEND_URL # e.g. https://cartpilot-web.onrender.com
        sync: false
      - key: CORS_ORIGIN # same as FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY # optional: leave empty for the demo gateway
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: cartpilot-ml
    runtime: python
    rootDir: ml
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: cartpilot-db
          property: connectionString
      - key: SEED_ON_START
        value: "true"

  - type: web
    name: cartpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL # e.g. https://cartpilot-api.onrender.com/api
        sync: false
